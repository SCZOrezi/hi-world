<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money Manager</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:20px;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:20px;
margin-bottom:20px;
box-shadow:0 10px 25px rgba(0,0,0,.3);
}

.balance{
text-align:center;
}

.balance h2{
font-size:40px;
color:#4ade80;
margin-top:10px;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px;
}

.stat{
padding:15px;
border-radius:15px;
text-align:center;
}

.income{
background:#14532d;
}

.expense{
background:#7f1d1d;
}

form{
display:grid;
gap:15px;
}

input,select,button{
padding:14px;
border:none;
border-radius:12px;
font-size:15px;
}

input,select{
background:#f8fafc;
}

button{
background:#3b82f6;
color:white;
cursor:pointer;
font-weight:bold;
transition:.3s;
}

button:hover{
background:#2563eb;
}

.list{
margin-top:20px;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
margin-bottom:10px;
background:rgba(255,255,255,.05);
border-radius:12px;
}

.plus{
border-left:5px solid #22c55e;
}

.minus{
border-left:5px solid #ef4444;
}

.delete{
background:#ef4444;
padding:8px 12px;
border-radius:8px;
cursor:pointer;
}

@media(max-width:700px){
.stats{
grid-template-columns:1fr;
}
}
</style>

</head>
<body>

<div class="container">

<h1>💰 Money Manager Bulanan</h1>

<div class="card balance">
<h3>Saldo Saat Ini</h3>
<h2 id="balance">Rp0</h2>

<div class="stats">

<div class="stat income">
<h4>Pemasukan</h4>
<h2 id="income">Rp0</h2>
</div>

<div class="stat expense">
<h4>Pengeluaran</h4>
<h2 id="expense">Rp0</h2>
</div>

</div>
</div>

<div class="card">

<form id="form">

<input
type="text"
id="desc"
placeholder="Keterangan"
required>

<input
type="number"
id="amount"
placeholder="Nominal"
required>

<select id="type">
<option value="income">Uang Masuk</option>
<option value="expense">Uang Keluar</option>
</select>

<button>Tambah Transaksi</button>

</form>

</div>

<div class="card">

<h2>Riwayat Transaksi</h2>

<div id="list" class="list"></div>

</div>

</div>

<script>

let data=JSON.parse(localStorage.getItem("moneyData"))||[];

const list=document.getElementById("list");

function rupiah(n){
return "Rp"+Number(n).toLocaleString("id-ID");
}

function save(){
localStorage.setItem("moneyData",JSON.stringify(data));
}

function render(){

list.innerHTML="";

let income=0;
let expense=0;

data.forEach((item,index)=>{

if(item.type=="income"){
income+=item.amount;
}else{
expense+=item.amount;
}

const div=document.createElement("div");

div.className="item "+(item.type=="income"?"plus":"minus");

div.innerHTML=`
<div>
<h3>${item.desc}</h3>
<small>${item.type=="income"?"Pemasukan":"Pengeluaran"}</small>
</div>

<div>
<b>${rupiah(item.amount)}</b>
</div>

<div class="delete" onclick="hapus(${index})">
🗑
</div>
`;

list.appendChild(div);

});

document.getElementById("income").innerHTML=rupiah(income);
document.getElementById("expense").innerHTML=rupiah(expense);
document.getElementById("balance").innerHTML=rupiah(income-expense);

save();

}

function hapus(i){
data.splice(i,1);
render();
}

document.getElementById("form").addEventListener("submit",e=>{

e.preventDefault();

const desc=document.getElementById("desc").value;
const amount=Number(document.getElementById("amount").value);
const type=document.getElementById("type").value;

data.unshift({
desc,
amount,
type
});

render();

e.target.reset();

});

render();

</script>

</body>
</html>
